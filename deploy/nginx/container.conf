# Container nginx - listen on unprivileged port 8080, not directly exposed publicly.
# When hosted behind nginx/Caddy, preserve its original scheme for the API.
map $http_x_forwarded_proto $original_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream interview_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 11m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://interview_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;
    }
}

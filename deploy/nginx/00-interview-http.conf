# Bootstrap HTTP challenge ONLY. Put in /etc/nginx/sites-available/interview.armember.ir
# and enable the site, request a certificate, then replace with the final HTTPS config.
server {
    listen 80;
    listen [::]:80;
    server_name interview.armember.ir;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 302 https://$host$request_uri; }
}

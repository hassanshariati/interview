name: One-shot STT recovery release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-stt-retry-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch tested production release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: hassanshariati/interview
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main --repo "$GH_REPO"
# activation: post-merge one-time production deployment

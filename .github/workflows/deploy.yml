name: Test and deploy Interview AI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interview-production
  cancel-in-progress: false

jobs:
  test:
    name: Test on GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

  deploy:
    name: Deploy to production via dedicated runner
    needs: test
    # Repository production runner advertises default self-hosted / Linux / X64 labels.
    # Environment protection and test dependency remain enforced.
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -d /opt/interview-ai/.git || { echo "Clone the repository into /opt/interview-ai first" >&2; exit 1; }
          test -f /opt/interview-ai/.env || { echo "Create /opt/interview-ai/.env on the server first" >&2; exit 1; }
          test -r /opt/interview-ai/.env || { echo "Runner must be able to read .env" >&2; exit 1; }
          command -v git
          command -v docker
          docker compose version
          docker info >/dev/null

      - name: Deploy selected main commit and verify health
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd /opt/interview-ai
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Tracked files have local changes; refusing to overwrite them" >&2
            exit 1
          fi
          git fetch origin main
          git checkout main
          git merge --ff-only "$DEPLOY_SHA"
          bash scripts/deploy.sh
          # Explicit one-time showcase seeding is idempotent: no real records are overwritten.
          docker compose exec -T api python -m backend.seed_demo
          docker compose exec -T api python -c 'import os; key=bool(os.getenv("OPENAI_API_KEY","").strip()); on=os.getenv("ENABLE_REALTIME","false").lower()=="true"; print("VOICE_KEY_PRESENT="+str(key)); print("VOICE_FLAG_ENABLED="+str(on)); print("VOICE_READY="+str(key and on))'
          curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health
          printf '\n'
          curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/public/jobs | python3 -c 'import json,sys; rows=json.load(sys.stdin); n=sum(bool(j.get("is_demo")) for j in rows); print("DEMO_JOBS_VISIBLE="+str(n)); assert n >= 10'

name: DSS PyPI mirrors diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/dss-server-preflight.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Try package index from isolated Python container
        shell: bash
        run: |
          set +e
          for index in https://pypi.org/simple https://pypi.tuna.tsinghua.edu.cn/simple https://mirrors.aliyun.com/pypi/simple https://pypi.python.org/simple; do
            echo "INDEX=$index"
            docker run --rm --entrypoint python public.ecr.aws/docker/library/python:3.12-slim \
              -m pip index versions fastapi --index-url "$index" --timeout 6 --retries 0 2>&1 | head -n 6
            echo "END_INDEX"
          done

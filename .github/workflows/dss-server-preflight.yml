name: DSS API health diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/dss-server-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect DSS containers and recent startup errors
        shell: bash
        run: |
          set +e
          echo "=== DSS CONTAINERS ==="
          cd /home/runner/dss
          docker compose ps -a
          echo "=== DSS API STATE ==="
          docker inspect dss-api-1 --format 'status={{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          echo "=== API RECENT LOGS ==="
          docker compose logs --tail=95 --no-color api | sed -E 's/(password|secret|token)(=[^ ]+)/\1=[REDACTED]/Ig'
          echo "=== HEALTH CHECK ==="
          curl -fsS --max-time 5 http://127.0.0.1:18110/api/health
          echo

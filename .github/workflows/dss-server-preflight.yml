name: DSS final read-only verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/dss-server-preflight.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Check DSS health and other applications
        shell: bash
        run: |
          set +e
          cd /home/runner/dss
          echo "DSS_LOCAL:"
          curl -fsS --max-time 5 http://127.0.0.1:18110/api/health
          echo
          echo "DSS_PUBLIC:"
          curl -fsS --max-time 10 https://dss.armember.ir/api/health
          echo
          echo "DSS_LOGIN_PAGE:"
          curl -s -o /dev/null -w '%{http_code}\n' --max-time 10 https://dss.armember.ir/login/management
          echo "ERP_STATUS:"
          curl -s -o /dev/null -w '%{http_code}\n' --max-time 10 https://armember.ir/
          echo "INTERVIEW_STATUS:"
          curl -s -o /dev/null -w '%{http_code}\n' --max-time 10 https://interview.armember.ir/
          echo "DSS_CONTAINERS:"
          docker compose ps
          echo "DSS_DEMO_SEED_CHECK:"
          docker compose exec -T api python -m app.seed_demo
          echo "ADMIN_EXISTS:"
          docker compose exec -T api python -c "import os;from sqlalchemy import create_engine,select;from sqlalchemy.orm import Session;from app.models import User;db=Session(create_engine(os.environ['DATABASE_URL']));print(bool(db.scalar(select(User.id).where(User.role == 'admin'))));db.close()"

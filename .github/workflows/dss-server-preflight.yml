name: DSS alternate registry probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/dss-server-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Check public ECR image registry for DSS bases
        shell: bash
        run: |
          set +e
          echo "Checking alternate mirror for Python and Node images..."
          docker pull public.ecr.aws/docker/library/python:3.12-slim
          echo "PYTHON_EXIT=$?"
          docker pull public.ecr.aws/docker/library/node:22-alpine
          echo "NODE_EXIT=$?"
          docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '(public.ecr.aws/docker/library/(python|node)|postgres:17-alpine)'

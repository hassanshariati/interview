name: Interview AI quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/job-portal-admin-dashboard, fix/admin-login-demo-seed-voice, fix/resume-postgres-and-contextual-voice, feature/deepseek-resume-interview, feature/gapgpt-chat-provider, fix/persian-interview-questions]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Backend tests
        run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: |
          node --check web/assets/portal.js
          node --check web/assets/admin.js
          node --check web/assets/candidate.js
          node --test tests/admin-login.test.cjs

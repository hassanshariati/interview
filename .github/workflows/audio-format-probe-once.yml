name: One-time safe audio format comparison
on:
  push:
    branches: [main]
    paths: [".github/workflows/audio-format-probe-once.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    environment: production
    steps:
      - name: Compare synthetic MP3 and WebM against configured STT
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/interview-ai
          echo "HOST_FFMPEG_PRESENT=$(command -v ffmpeg >/dev/null && echo true || echo false)"
          echo "API_FFMPEG_PRESENT=$(docker compose exec -T api sh -c 'command -v ffmpeg >/dev/null && echo true || echo false')"
          if ! command -v ffmpeg >/dev/null; then
            echo "WEBM_PROBE=skipped_host_ffmpeg_unavailable"
            exit 0
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          docker compose exec -T api python - <<'PY' > "$tmp/synthetic.mp3"
          import asyncio,sys
          from backend.interview_audio import persian_question_mp3
          sys.stdout.buffer.write(asyncio.run(persian_question_mp3("سلام. این یک فایل آزمایشی برای بررسی فرمت ضبط صدا است.")))
          PY
          ffmpeg -hide_banner -loglevel error -y -i "$tmp/synthetic.mp3" -vn -c:a libopus -b:a 32k -f webm "$tmp/synthetic.webm"
          for fmt in mp3 webm; do
            docker compose exec -T -e FMT="$fmt" api python -c '
          import asyncio,sys,os,httpx
          from backend.gapgpt import gapgpt_config
          fmt=os.environ["FMT"]
          sound=sys.stdin.buffer.read()
          key,model,base=gapgpt_config()
          async def check():
              async with httpx.AsyncClient(timeout=55,follow_redirects=False) as client:
                  response=await client.post(base+"/audio/transcriptions",
                    headers={"Authorization":"Bearer "+key},
                    files={"file":("synthetic."+fmt,sound, "audio/mpeg" if fmt=="mp3" else "audio/webm")},
                    data={"model":os.getenv("GAPGPT_STT_MODEL","whisper-1"),"response_format":"json","language":"fa"})
                  print(fmt.upper()+"_UPSTREAM_HTTP="+str(response.status_code))
                  if response.status_code==200:
                      print(fmt.upper()+"_TEXT_EXISTS="+str(bool(response.json().get("text"))))
          asyncio.run(check())
          ' < "$tmp/synthetic.$fmt"
          done

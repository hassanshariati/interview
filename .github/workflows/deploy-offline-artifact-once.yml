name: One-time offline artifact production release
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-offline-artifact-once.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: interview-production
  cancel-in-progress: false
jobs:
  pack:
    name: Build isolated production image and signed-by-hash source bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Python and browser regression tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
          node --check web/assets/candidate.js
          node --test tests/candidate-ptt.test.cjs
      - name: Build Linux Docker image and version-locked Git bundle
        run: |
          set -euo pipefail
          mkdir -p release
          git update-ref refs/heads/offline-release "$GITHUB_SHA"
          git bundle create release/release.bundle refs/heads/offline-release
          git bundle verify release/release.bundle
          docker build --tag interview-ai-api:latest .
          docker save interview-ai-api:latest | gzip -1 > release/api-image.tar.gz
          printf '%s\n' "$GITHUB_SHA" > release/DEPLOY_SHA
          (cd release && sha256sum release.bundle api-image.tar.gz DEPLOY_SHA > SHA256SUMS)
          du -h release/*
      - uses: actions/upload-artifact@v4
        with:
          name: interview-offline-production
          path: release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  deploy:
    name: Deploy verified offline image to production runner
    needs: pack
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: interview-offline-production
          path: ${{ runner.temp }}/interview-release
      - name: Verify offline source and image and update production
        env:
          DEPLOY_SHA: ${{ github.sha }}
          PKG_DIR: ${{ runner.temp }}/interview-release
        run: |
          set -euo pipefail
          cd "$PKG_DIR"
          sha256sum -c SHA256SUMS
          test "$(cat DEPLOY_SHA)" = "$DEPLOY_SHA"
          cd /opt/interview-ai
          [[ -f .env ]] || { echo ".env missing" >&2; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=no)" ]] || { echo "Dirty tracked tree; refusing deploy" >&2; exit 1; }
          git bundle verify "$PKG_DIR/release.bundle"
          git fetch "$PKG_DIR/release.bundle" refs/heads/offline-release
          git cat-file -e "$DEPLOY_SHA^{commit}"
          git checkout main
          git merge --ff-only "$DEPLOY_SHA"
          docker load -i "$PKG_DIR/api-image.tar.gz"
          docker image inspect interview-ai-api:latest >/dev/null
          docker compose config --quiet
          docker compose up -d --no-build --no-deps --force-recreate api
          docker compose up -d --no-build --wait --wait-timeout 180
          docker compose exec -T api python -m backend.seed_demo
          curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health
          printf '\n'
          curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/public/jobs | python3 -c 'import json,sys; x=json.load(sys.stdin); print("DEMO_JOBS_VISIBLE="+str(sum(bool(i.get("is_demo")) for i in x)))'
          docker compose exec -T api python -c 'import shutil; print("FFMPEG_PRESENT="+str(bool(shutil.which("ffmpeg"))))'

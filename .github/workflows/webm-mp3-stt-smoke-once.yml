name: One-time synthetic WebM to GapGPT speech test
on:
  push:
    branches: [main]
    paths: [".github/workflows/webm-mp3-stt-smoke-once.yml"]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 6
    steps:
      - name: Verify v0.5.4 and transcribe synthetic WebM through real MP3 normalizer
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/interview-ai
          docker compose exec -T api python - <<'PY'
          import os,asyncio,subprocess
          from backend.interview_audio import persian_question_mp3, normalize_browser_audio, gapgpt_transcribe_audio
          from backend.gapgpt import configured
          print("CANONICAL_AUDIO_API_CONFIGURED="+str(configured()))
          assert configured(), "STT provider not configured"
          speech=asyncio.run(persian_question_mp3(
              "سلام. این یک فایل آزمایشی ساختگی برای بررسی پاسخ فارسی مصاحبه است."))
          encoded=subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-nostdin",
              "-i","pipe:0","-c:a","libopus","-b:a","32k","-f","webm","pipe:1"],
              input=speech,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30,check=True).stdout
          assert len(encoded)>1024 and encoded[:4]==b"\x1a\x45\xdf\xa3"
          print("WEBM_OPUS_SYNTHETIC_BYTES="+str(len(encoded)))
          normalized=asyncio.run(normalize_browser_audio(encoded,"audio/webm;codecs=opus"))
          assert normalized[:3]==b"ID3"
          print("MP3_NORMALIZED_BYTES="+str(len(normalized)))
          result=asyncio.run(gapgpt_transcribe_audio(encoded,"audio/webm;codecs=opus"))
          print("WEBM_TO_GAPGPT_TRANSCRIPTION_SUCCESS="+str(bool(result.strip())))
          assert bool(result.strip())
          PY
          curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health | python3 -c 'import json,sys; x=json.load(sys.stdin); print("API_VERSION="+x["version"]); assert x["version"]=="0.5.4"'
# Retry after verified offline production installation of v0.5.4

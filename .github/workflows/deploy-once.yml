name: One-shot production queue repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Release stuck production deployment queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete runner-label deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: hassanshariati/interview
        run: |
          set -euo pipefail
          gh run cancel 41785710417 --repo "$GH_REPO"

# Retry after aligning the production runner labels with registered self-hosted runner.

name: One-shot application error diagnosis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-application-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 6
    steps:
      - name: Exercise sample application inside rollback-only database transaction
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/interview-ai
          docker compose exec -T api python - <<'PY'
          import traceback
          from sqlalchemy import select, text
          from sqlalchemy.orm import Session
          from fastapi.testclient import TestClient
          from backend import models
          from backend.db import engine, get_db
          from backend.main import app

          with engine.connect() as conn:
              outer = conn.begin()
              session = Session(bind=conn, join_transaction_mode="create_savepoint")
              def isolated_db():
                  yield session
              app.dependency_overrides[get_db] = isolated_db
              try:
                  job = session.scalar(select(models.Job).order_by(models.Job.id))
                  assert job is not None, "No job to test"
                  with TestClient(app, raise_server_exceptions=True) as client:
                      for file_part in (False, True):
                          parts = {"file": ("sample.txt", b"Python, Kubernetes and PostgreSQL", "text/plain")} if file_part else None
                          try:
                              response = client.post("/api/v1/public/applications", data={
                                  "job_id": str(job.id),
                                  "full_name": "Synthetic Test",
                                  "email": "synthetic.rollback@example.com",
                              }, files=parts)
                              print("APPLICATION_FILE=" + str(file_part) + " STATUS=" + str(response.status_code))
                              if response.status_code >= 400:
                                  print("ERROR_DETAIL=" + str(response.json().get("detail", ""))[:300])
                          except Exception:
                              print("APPLICATION_FILE=" + str(file_part) + " raised exception")
                              print("\n".join(traceback.format_exc().splitlines()[-28:]))
                  cols = conn.execute(text("SELECT column_name, data_type FROM information_schema.columns WHERE table_schema='public' AND table_name IN ('candidates','invitations','audit_events') ORDER BY table_name, ordinal_position")).all()
                  print("SCHEMA_COLUMN_TYPES=" + str(cols))
              finally:
                  app.dependency_overrides.pop(get_db, None)
                  session.close()
                  outer.rollback()
          PY

      - name: Summarize exceptions without applicant details
        shell: bash
        run: |
          cd /opt/interview-ai
          python3 - <<'PY'
          import collections, re, subprocess
          result = subprocess.run(["docker","compose","logs","--since","3h","--no-color","api"],
                                  capture_output=True, text=True)
          raw=result.stdout + result.stderr
          lines=raw.splitlines()
          markers=[(i,line) for i,line in enumerate(lines) if "Exception in ASGI application" in line]
          print("ASGI_EXCEPTION_EVENTS="+str(len(markers)))
          exceptions=collections.Counter()
          frames=collections.Counter()
          for i,_ in markers[-15:]:
              snippet=lines[i+1:i+110]
              for entry in snippet:
                  m=re.search(r"File \"(/app/(?:backend|web)/[^\"]+)\", line (\d+), in ([a-zA-Z_][a-zA-Z0-9_]*)",entry)
                  if m: frames[(m.group(1),m.group(2),m.group(3))]+=1
                  m=re.search(r"(?:^|\s)([\w.]+(?:Error|Exception)):",entry)
                  if m: exceptions[m.group(1)]+=1
                  if "Exception in ASGI application" in entry:break
          print("EXCEPTION_CLASSES="+str(exceptions))
          print("BACKEND_TRACE_LOCATIONS="+str(frames))
          print("LOG_CAPTURE_EXIT_CODE="+str(result.returncode))
          PY

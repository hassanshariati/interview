name: One-shot GapGPT production release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-gapgpt-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Start tested production release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: hassanshariati/interview
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main --repo "$GH_REPO"

name: One-time DeepSeek connection smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deepseek-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Test configured provider and synthetic API prompt without leaking secrets
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/interview-ai
          docker compose exec -T api python - <<'PY'
          import asyncio
          import os
          from fastapi import HTTPException
          from backend.deepseek import configured, generate_question

          provider = os.getenv("LLM_PROVIDER", "").strip().lower()
          print("LLM_PROVIDER_IS_DEEPSEEK="+str(provider=="deepseek"))
          print("DEEPSEEK_KEY_CONFIGURED="+str(configured()))
          print("DEEPSEEK_MODEL_IS_FLASH="+str(os.getenv("DEEPSEEK_MODEL", "deepseek-flash")=="deepseek-flash"))
          if not configured():
              print("DEEPSEEK_API_SMOKE=not_configured")
              raise SystemExit(2)
          try:
              response = asyncio.run(generate_question(
                  "Ask one short practical interview question about Kubernetes in Persian.",
                  [], None))
              print("DEEPSEEK_API_SMOKE=success")
              print("ANSWER_CHARACTERS="+str(len(response)))
          except HTTPException as exc:
              print("DEEPSEEK_API_SMOKE=failed")
              print("ERROR_HTTP_STATUS="+str(exc.status_code))
              print("ERROR_CATEGORY="+str(exc.detail))
              raise SystemExit(1)
          PY

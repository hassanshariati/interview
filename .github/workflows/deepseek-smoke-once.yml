name: One-time DeepSeek account balance verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deepseek-smoke-once.yml"

permissions:
  contents: read

jobs:
  balance:
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 4
    steps:
      - name: Check official balance availability without exposing key or amounts
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/interview-ai
          docker compose exec -T api python - <<'PY'
          import httpx
          from backend.deepseek import deepseek_config
          key, model, base = deepseek_config()
          with httpx.Client(timeout=15, follow_redirects=False) as client:
              result = client.get("https://api.deepseek.com/user/balance",
                                  headers={"Authorization": "Bearer " + key})
          print("BALANCE_ENDPOINT_HTTP_STATUS="+str(result.status_code))
          if result.status_code == 200:
              data = result.json()
              print("DEEPSEEK_BALANCE_IS_AVAILABLE="+str(data.get("is_available")))
          PY

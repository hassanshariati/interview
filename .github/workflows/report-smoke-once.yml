name: One-time synthetic GapGPT report smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/report-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 4
    steps:
      - name: Verify AI report using fictional transcript only
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/interview-ai
          docker compose exec -T api python - <<'PY'
          import asyncio
          import os
          from fastapi import HTTPException
          from backend.interview_review import generate_interview_review
          from backend.gapgpt import configured
          provider = os.getenv("LLM_PROVIDER", "").lower()
          print("REPORT_PROVIDER_IS_GAPGPT="+str(provider=="gapgpt"))
          print("GAPGPT_CREDENTIALS_CONFIGURED="+str(configured()))
          if not configured():
              print("REPORT_SMOKE=skipped_unconfigured")
              raise SystemExit(0)
          transcript = [
              {"source":"server_llm","role":"interviewer",
               "text":"سلام! در یک پروژه Kubernetes چگونه Pod مشکل‌دار را عیب‌یابی کردی؟"},
              {"source":"candidate_ai","role":"candidate",
               "text":"در پروژه آزمایشی ابتدا kubectl describe pod و سپس logs را بررسی کردم."},
              {"source":"server_llm","role":"interviewer",
               "text":"چطور از درست‌بودن تغییر اطمینان حاصل کردی؟"},
              {"source":"candidate_ai","role":"candidate",
               "text":"با بررسی readiness و اجرای یک درخواست تستی تغییر را ارزیابی کردم."},
          ]
          try:
              report = asyncio.run(generate_interview_review(
                  "gapgpt", "مهندس زیرساخت آزمایشی", ["Kubernetes", "Linux"], transcript))
              valid = bool(report.get("summary")) and all(
                  isinstance(report.get(key), list) for key in (
                      "evidence_strengths","evidence_gaps","follow_up_questions"))
              print("REPORT_SMOKE="+("success" if valid else "invalid_output"))
              print("REPORT_ANSWER_COUNT="+str(report.get("answer_count")))
              print("REPORT_KEYS_VALID="+str(valid))
              raise SystemExit(0 if valid else 1)
          except HTTPException as exc:
              print("REPORT_SMOKE=provider_error")
              print("REPORT_HTTP_STATUS="+str(exc.status_code))
              print("REPORT_FAILURE_TYPE="+str(exc.detail))
              raise SystemExit(1)
          PY

name: One-time CV fix production release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cv-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Trigger existing production rollout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch reviewed workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: hassanshariati/interview
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main --repo "$GH_REPO"

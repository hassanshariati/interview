name: One-time private audio service diagnostic
on:
  push:
    branches: [main]
    paths: [".github/workflows/audio-provider-diagnostic-once.yml"]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    environment: production
    steps:
      - name: Classify recent STT failures and test synthetic short speech without exposing keys or applicant audio
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/interview-ai
          docker compose logs --no-color --since 5h api 2>/dev/null | python3 -c '
          import sys, collections
          types=collections.Counter()
          for x in sys.stdin:
              if "STT upstream timeout" in x: types["timeout"]+=1
              elif "STT upstream connection" in x: types["connection"]+=1
              elif "STT upstream returned HTTP" in x: types["http_5xx"]+=1
              elif "STT upstream rejected request status=" in x: types["other_http"]+=1
              elif "STT upstream response could not be parsed" in x: types["parse"]+=1
          print("RECENT_STT_FAILURE_TYPES="+repr(dict(types)))'
          docker compose exec -T api python - <<'PY'
          import asyncio,os
          import httpx
          from backend.interview_audio import persian_question_mp3
          from backend.gapgpt import gapgpt_config
          try:
              key, _,base=gapgpt_config()
              audio=asyncio.run(persian_question_mp3("سلام. این فقط یک تست کوتاه برای بررسی تبدیل گفتار است."))
              print("SYNTHETIC_AUDIO_BYTES="+str(len(audio)))
              async def test():
                  async with httpx.AsyncClient(timeout=httpx.Timeout(50,connect=8),follow_redirects=False) as c:
                      r=await c.post(base+"/audio/transcriptions",
                          headers={"Authorization":"Bearer "+key},
                          files={"file":("test.mp3",audio,"audio/mpeg")},
                          data={"model":os.getenv("GAPGPT_STT_MODEL","whisper-1"),"language":"fa","response_format":"json"})
                      print("SYNTHETIC_MP3_STT_HTTP_STATUS="+str(r.status_code))
                      if r.status_code==200:
                          data=r.json()
                          print("SYNTHETIC_MP3_STT_TEXT_PRESENT="+str(bool(data.get("text"))))
              asyncio.run(test())
          except Exception as e:
              print("DIAGNOSTIC_EXCEPTION_TYPE="+type(e).__name__)
          PY

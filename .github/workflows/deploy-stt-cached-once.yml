name: One-time cached FFmpeg image production release
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-stt-cached-once.yml"]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy canonical MP3 normalizer with cached pip layer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: hassanshariati/interview
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main --repo "$GH_REPO"

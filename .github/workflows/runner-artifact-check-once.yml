name: One-time isolated runner artifact-transfer check
on:
  push:
    branches: [main]
    paths: [".github/workflows/runner-artifact-check-once.yml"]
permissions:
  contents: read
  actions: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Create non-sensitive transfer test
        run: printf '%s\n' 'INTERVIEW_ARTIFACT_PROBE_V1' > probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: interview-probe
          path: probe.txt
          retention-days: 1
  receive:
    needs: pack
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: interview-probe
          path: ${{ runner.temp }}/interview-probe
      - name: Verify transfer
        run: |
          set -euo pipefail
          grep -qx 'INTERVIEW_ARTIFACT_PROBE_V1' "${{ runner.temp }}/interview-probe/probe.txt"
          echo 'RUNNER_ARTIFACT_TRANSFER_SUCCESS=True'

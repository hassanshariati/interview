name: Test CV persistence on PostgreSQL 17

on:
  push:
    branches: [fix/resume-postgres-and-contextual-voice]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: interview_ci
          POSTGRES_USER: interview_ci
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U interview_ci -d interview_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://interview_ci:ci-only@127.0.0.1:5432/interview_ci
      BOOTSTRAP_ADMIN_EMAIL: test-admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: synthetic-integration-passphrase
      APP_ORIGIN: http://testserver
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Test NUL-containing CV registration with real PostgreSQL
        run: |
          python -m pip install -r requirements.txt
          PYTHONPATH=. python tests/postgres_integration.py

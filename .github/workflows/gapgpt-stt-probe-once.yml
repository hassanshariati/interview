name: One-time synthetic GapGPT transcription support check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gapgpt-stt-probe-once.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 4
    steps:
      - name: Check audio endpoint with generated sine wave, no candidate data
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/interview-ai
          docker compose exec -T api python - <<'PY'
          import io, wave, struct, math, httpx, os
          from backend.gapgpt import gapgpt_config
          provider=os.getenv("LLM_PROVIDER","").lower()
          print("GAPGPT_SELECTED="+str(provider=="gapgpt"))
          if provider!="gapgpt":
              print("PROBE_STATUS=SKIPPED")
              raise SystemExit(0)
          try:
              key,_,base=gapgpt_config()
              audio=io.BytesIO()
              with wave.open(audio,"wb") as wav:
                  wav.setnchannels(1);wav.setsampwidth(2);wav.setframerate(8000)
                  wav.writeframes(b"".join(struct.pack("<h",int(3000*math.sin(2*math.pi*440*i/8000))) for i in range(8000)))
              with httpx.Client(timeout=25,follow_redirects=False) as client:
                  resp=client.post(base+"/audio/transcriptions",
                      headers={"Authorization":"Bearer "+key},
                      files={"file":("synthetic-tone.wav",audio.getvalue(),"audio/wav")},
                      data={"model":"whisper-1","language":"fa","response_format":"json"})
              print("GAPGPT_STT_HTTP_STATUS="+str(resp.status_code))
              if resp.status_code==200:
                  result=resp.json()
                  print("GAPGPT_STT_FORMAT_OK="+str(isinstance(result,dict) and isinstance(result.get("text"),str)))
              elif resp.status_code in (401,402,403,404,429):
                  print("GAPGPT_STT_UNAVAILABLE_CLASS="+str(resp.status_code))
              else:
                  print("GAPGPT_STT_UNEXPECTED_STATUS=True")
          except Exception as exc:
              print("GAPGPT_STT_PROBE_EXCEPTION="+type(exc).__name__)
          PY
